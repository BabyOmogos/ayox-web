<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 1000" fill="none" aria-hidden="true">
  <!-- Continuous vertical main pipes spanning full height for seamless vertical tile -->
  <g stroke="#89cfe5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <line x1="50" y1="0" x2="50" y2="1000" stroke-width="2.5" />
    <line x1="70" y1="0" x2="70" y2="1000" stroke-width="1.5" />
    <line x1="88" y1="0" x2="88" y2="1000" stroke-width="2" />
    <line x1="110" y1="0" x2="110" y2="1000" stroke-width="1.5" />
    <line x1="140" y1="0" x2="140" y2="1000" stroke-width="2.5" />
    <line x1="170" y1="0" x2="170" y2="1000" stroke-width="1.5" />
    <line x1="200" y1="0" x2="200" y2="1000" stroke-width="2" />
    <line x1="235" y1="0" x2="235" y2="1000" stroke-width="1.5" />
    <line x1="270" y1="0" x2="270" y2="1000" stroke-width="2" />
    <line x1="315" y1="0" x2="315" y2="1000" stroke-width="1.5" />

    <!-- Horizontal connector branches & ticks -->
    <line x1="50" y1="60" x2="140" y2="60" />
    <line x1="88" y1="90" x2="200" y2="90" />
    <line x1="50" y1="120" x2="110" y2="120" />
    <line x1="50" y1="160" x2="88" y2="160" />
    <line x1="50" y1="210" x2="170" y2="210" />
    <line x1="140" y1="260" x2="270" y2="260" />
    <line x1="50" y1="310" x2="140" y2="310" />
    <line x1="88" y1="350" x2="235" y2="350" />
    <line x1="50" y1="400" x2="110" y2="400" />
    <line x1="140" y1="460" x2="315" y2="460" stroke-width="2" />
    <line x1="50" y1="520" x2="170" y2="520" />
    <line x1="88" y1="580" x2="200" y2="580" />
    <line x1="50" y1="640" x2="110" y2="640" />
    <line x1="140" y1="710" x2="270" y2="710" />
    <line x1="50" y1="780" x2="170" y2="780" />
    <line x1="88" y1="840" x2="235" y2="840" />
    <line x1="50" y1="910" x2="140" y2="910" />
    <line x1="110" y1="960" x2="200" y2="960" />

    <!-- Outward branches -->
    <line x1="270" y1="210" x2="410" y2="210" />
    <line x1="270" y1="460" x2="430" y2="460" />
    <line x1="235" y1="710" x2="390" y2="710" />
  </g>

  <!-- Cluster of cascading overlapping circles (pressure gauges / meters) at top left -->
  <g stroke="#0282ae" stroke-width="2" opacity="0.75">
    <circle cx="110" cy="85" r="24" />
    <circle cx="120" cy="100" r="26" />
    <circle cx="132" cy="116" r="28" stroke-width="2.5" />
    <circle cx="146" cy="135" r="30" />
    <circle cx="162" cy="158" r="32" stroke-width="2.5" />
    <!-- Inner rings & hubs -->
    <circle cx="132" cy="116" r="10" stroke="#89cfe5" stroke-width="1.5" />
    <circle cx="162" cy="158" r="12" stroke="#89cfe5" stroke-width="1.5" />
    <circle cx="132" cy="116" r="3" fill="#0282ae" />
    <circle cx="162" cy="158" r="3.5" fill="#0282ae" />
  </g>

  <!-- Upper cluster of cascading overlapping rectangular valve / meter boxes -->
  <g stroke="#0282ae" stroke-width="2" opacity="0.7">
    <rect x="250" y="205" width="70" height="48" rx="2" />
    <rect x="268" y="228" width="70" height="48" rx="2" />
    <rect x="286" y="250" width="70" height="48" rx="2" stroke-width="2.5" />
    <rect x="304" y="274" width="70" height="48" rx="2" />
    <rect x="322" y="298" width="74" height="52" rx="2" stroke-width="2.5" />
  </g>

  <!-- Lower cluster of cascading overlapping rectangular valve / meter boxes -->
  <g stroke="#0282ae" stroke-width="2" opacity="0.7">
    <rect x="250" y="415" width="70" height="48" rx="2" />
    <rect x="268" y="448" width="70" height="48" rx="2" />
    <rect x="286" y="488" width="70" height="48" rx="2" stroke-width="2.5" />
    <rect x="304" y="508" width="70" height="48" rx="2" />
    <rect x="322" y="562" width="76" height="54" rx="2" stroke-width="2.5" />
  </g>

  <!-- Vertical connectors passing through rectangular boxes -->
  <g stroke="#89cfe5" stroke-width="2" stroke-dasharray="4 4" opacity="0.6">
    <line x1="285" y1="180" x2="285" y2="380" />
    <line x1="340" y1="210" x2="340" y2="410" />
    <line x1="285" y1="390" x2="285" y2="640" />
    <line x1="340" y1="430" x2="340" y2="670" />
  </g>

  <!-- Additional lower accent gauge -->
  <g stroke="#0282ae" stroke-width="2" opacity="0.65">
    <circle cx="170" cy="670" r="22" />
    <circle cx="170" cy="670" r="7" stroke="#89cfe5" />
    <line x1="170" y1="655" x2="170" y2="685" />
    <line x1="155" y1="670" x2="185" y2="670" />
  </g>

  <!-- Floating droplet / connection bubble nodes flowing down -->
  <g fill="#89cfe5" opacity="0.5">
    <circle cx="68" cy="550" r="4.5" />
    <circle cx="78" cy="610" r="5" />
    <circle cx="74" cy="670" r="4" />
    <circle cx="118" cy="740" r="5" />
    <circle cx="132" cy="790" r="5.5" />
    <circle cx="150" cy="830" r="4" />
    <circle cx="218" cy="880" r="6" />
    <circle cx="258" cy="930" r="4.5" />
  </g>
</svg>
